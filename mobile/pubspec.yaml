name: tpm_mobile
description: "Transformation Project Ministries — mobile app for members, branch leaders and the pastor's office."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # Playfair Display (display) + Montserrat (body) — the two brand faces.
  google_fonts: ^6.2.1
  # Date/number formatting for the service countdown and GHS amounts.
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/brand/
    - assets/photos/
    - assets/media/
    - assets/books/
    - assets/give/
    - assets/leaders/
