name: tpm_mobile
description: "Transformation Project Ministries — mobile app for members, branch leaders and the pastor's office."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # Playfair Display (display) + Montserrat (body) — the two brand faces.
  google_fonts: ^6.2.1
  # Date/number formatting for the service countdown and GHS amounts.
  intl: ^0.20.2
  # Talks to the TPM API for auth.
  http: ^1.2.2
  # Persists the signed-in session's JWT across app restarts.
  shared_preferences: ^2.3.3
  # Opens Google Maps (directions), the dialer, mail, and WhatsApp from a tap.
  url_launcher: ^6.3.1
  # Embeds YouTube's own player in-app for sermon/podcast videos, so watching
  # never hands off to the YouTube app or a browser.
  youtube_player_iframe: ^5.2.0
  # Parses the podcast RSS feed the ministry's audio messages are published
  # to (via Anchor/Spotify for Podcasters) into episode title/date/audio URL.
  xml: ^6.5.0
  # Real audio playback for those episodes — play/pause/seek/duration.
  just_audio: ^0.9.42
  # Where a downloaded episode's mp3 is saved on disk.
  path_provider: ^2.1.6
  # The native share sheet, for sharing a message's real audio link.
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/brand/
    - assets/photos/
    - assets/media/
    - assets/books/
    - assets/give/
    - assets/leaders/
    - assets/team/
    - assets/flyers/
    - assets/missions/
    - assets/branches/
