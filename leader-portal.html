<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="assets/images/TPM LOGO ONE.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Portal — Transformation Project Ministries</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:       #080808;
            --surface:  #111111;
            --surface2: #181818;
            --border:   rgba(255,255,255,0.06);
            --gold:     #c9a84c;
            --gold-bg:  rgba(201,168,76,0.1);
            --text:     #f0f0f0;
            --text-dim: rgba(255,255,255,0.55);
            --text-muted: rgba(255,255,255,0.28);
            --sidebar:  240px;
            --r:        10px;
            --r-lg:     16px;
            --font-body: 'Montserrat', sans-serif;
            --font-display: 'Playfair Display', serif;
        }

        body { font-family: var(--font-body); background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }

        /* ── AUTH ─────────────────────────────────── */
        .mp-auth {
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 40px 20px;
            background:
                radial-gradient(ellipse at 10% 10%, rgba(201,168,76,0.07) 0%, transparent 55%),
                radial-gradient(ellipse at 90% 90%, rgba(30,58,138,0.09) 0%, transparent 55%),
                var(--bg);
        }

        .mp-auth-card {
            width: 100%; max-width: 500px;
            background: var(--surface);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: var(--r-lg);
            padding: 40px 36px;
            box-shadow: 0 32px 64px rgba(0,0,0,0.6);
        }

        .mp-auth-logo { text-align: center; margin-bottom: 30px; }
        .mp-auth-logo img { height: 44px; object-fit: contain; }
        .mp-auth-logo-name { font-family: var(--font-display); font-size: 1.1rem; color: var(--text); margin-top: 10px; }
        .mp-auth-logo-sub  { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2.5px; color: var(--gold); margin-top: 4px; }

        .mp-auth-h   { font-family: var(--font-display); font-size: 1.5rem; color: var(--text); text-align: center; margin-bottom: 4px; }
        .mp-auth-sub { font-size: 0.75rem; color: var(--text-muted); text-align: center; margin-bottom: 24px; }

        .mp-field { margin-bottom: 14px; }
        .mp-field label { display: block; font-size: 0.64rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.4px; color: var(--text-muted); margin-bottom: 6px; }
        .mp-field input, .mp-field select {
            width: 100%; background: var(--surface2);
            border: 1px solid rgba(255,255,255,0.09); border-radius: var(--r);
            padding: 11px 14px; font-size: 0.85rem; color: var(--text);
            font-family: var(--font-body); outline: none; transition: border-color 0.2s; -webkit-appearance: none;
        }
        .mp-field input:focus, .mp-field select:focus { border-color: rgba(201,168,76,0.5); }
        .mp-field input::placeholder { color: rgba(255,255,255,0.2); }
        .mp-field select option { background: #1a1a2e; }

        .mp-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .mp-btn {
            width: 100%; padding: 12px; border: none; border-radius: var(--r);
            background: linear-gradient(135deg, #c9a84c, #a07830);
            color: #fff; font-family: var(--font-body); font-size: 0.83rem;
            font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase;
            cursor: pointer; transition: opacity 0.2s, transform 0.1s; margin-top: 6px;
        }
        .mp-btn:hover { opacity: 0.88; }
        .mp-btn:active { transform: scale(0.99); }
        .mp-btn.ghost {
            background: transparent; border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-dim); margin-top: 8px;
        }
        .mp-btn.ghost:hover { background: rgba(255,255,255,0.05); color: var(--text); }

        .mp-link-row { text-align: center; margin-top: 16px; font-size: 0.79rem; color: var(--text-muted); }
        .mp-link-row a { color: var(--gold); text-decoration: none; cursor: pointer; font-weight: 600; }
        .mp-link-row a:hover { text-decoration: underline; }

        .mp-msg { padding: 10px 14px; border-radius: var(--r); font-size: 0.79rem; margin-bottom: 14px; display: none; }
        .mp-msg.err { background: rgba(220,60,60,0.12); border: 1px solid rgba(220,60,60,0.25); color: #f87171; display: block; }
        .mp-msg.ok  { background: rgba(60,180,100,0.12); border: 1px solid rgba(60,180,100,0.25); color: #6ee7a0; display: block; }

        .mp-steps { display: flex; align-items: center; gap: 6px; justify-content: center; margin-bottom: 5px; }
        .mp-step-dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.15); transition: background 0.3s; }
        .mp-step-dot.on { background: var(--gold); }
        .mp-step-lbl { font-size: 0.67rem; color: var(--text-muted); text-align: center; margin-bottom: 18px; }

        .mp-role-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 14px; }
        .mp-role-card {
            border: 1px solid var(--border); border-radius: var(--r); padding: 16px 8px;
            text-align: center; cursor: pointer; transition: all 0.2s; background: var(--surface2);
        }
        .mp-role-card:hover { border-color: rgba(201,168,76,0.3); }
        .mp-role-card.selected { border-color: var(--gold); background: var(--gold-bg); }
        .mp-role-icon { font-size: 1.5rem; margin-bottom: 6px; }
        .mp-role-name { font-size: 0.72rem; font-weight: 700; color: var(--text); text-transform: uppercase; letter-spacing: 0.5px; }
        .mp-role-desc { font-size: 0.61rem; color: var(--text-muted); margin-top: 3px; line-height: 1.4; }

        /* ── PORTAL SHELL ─────────────────────────── */
        .mp-shell { display: flex; min-height: 100vh; }

        .mp-sidebar {
            width: var(--sidebar);
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex; flex-direction: column;
            position: fixed; top: 0; left: 0; bottom: 0;
            z-index: 300; transition: transform 0.25s ease;
        }

        .mp-sidebar-brand {
            padding: 18px 16px;
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 10px;
        }
        .mp-sidebar-brand img { height: 26px; object-fit: contain; flex-shrink: 0; }
        .mp-brand-name  { font-size: 0.72rem; font-weight: 700; color: var(--text); }
        .mp-brand-label { font-size: 0.58rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.8px; color: var(--gold); margin-top: 2px; }

        .mp-sidenav { flex: 1; padding: 10px 8px; overflow-y: auto; }
        .mp-nav-group-label { font-size: 0.57rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: var(--text-muted); padding: 0 8px; margin: 18px 0 5px; }
        .mp-nav-group-label:first-child { margin-top: 6px; }

        .mp-nav-btn {
            width: 100%; display: flex; align-items: center; gap: 9px;
            padding: 9px 10px; background: none; border: none; border-radius: 8px;
            color: var(--text-dim); font-size: 0.8rem; font-weight: 600;
            cursor: pointer; text-align: left; transition: background 0.15s, color 0.15s;
            margin-bottom: 1px; font-family: var(--font-body);
        }
        .mp-nav-btn:hover { background: rgba(255,255,255,0.05); color: var(--text); }
        .mp-nav-btn.active { background: var(--gold-bg); color: var(--gold); }
        .mp-nav-icon { font-size: 1rem; width: 20px; text-align: center; flex-shrink: 0; }

        .mp-sidebar-user { padding: 14px 12px; border-top: 1px solid var(--border); }
        .mp-user-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .mp-user-av {
            width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
            background: linear-gradient(135deg, rgba(30,58,138,0.8), rgba(201,168,76,0.4));
            border: 1.5px solid rgba(201,168,76,0.35);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.85rem; font-weight: 700; color: rgba(255,255,255,0.8);
            font-family: var(--font-display);
        }
        .mp-user-name { font-size: 0.78rem; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .mp-role-badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 20px; font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; margin-top: 2px; }
        .mp-role-badge.member { background: rgba(59,130,246,0.15); color: #60a5fa; }
        .mp-role-badge.leader { background: rgba(201,168,76,0.15); color: var(--gold); }
        .mp-role-badge.admin  { background: rgba(168,85,247,0.15); color: #c084fc; }

        .mp-logout-btn {
            width: 100%; padding: 8px; background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08); border-radius: 7px;
            color: var(--text-dim); font-size: 0.71rem; font-weight: 600;
            cursor: pointer; transition: all 0.2s; font-family: var(--font-body);
        }
        .mp-logout-btn:hover { background: rgba(255,255,255,0.09); color: var(--text); }

        /* Main area */
        .mp-main { margin-left: var(--sidebar); flex: 1; display: flex; flex-direction: column; min-height: 100vh; }

        .mp-topbar {
            padding: 13px 28px;
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 12px;
            background: var(--surface);
            position: sticky; top: 0; z-index: 100;
        }
        .mp-topbar-title { font-size: 0.88rem; font-weight: 700; color: var(--text); }
        .mp-topbar-greet { font-size: 0.8rem; color: var(--text-muted); margin-left: auto; }

        .mp-mob-toggle {
            display: none; background: none;
            border: 1px solid rgba(255,255,255,0.1); border-radius: 6px;
            padding: 6px 10px; color: var(--text-dim); cursor: pointer; font-size: 1.05rem;
        }

        .mp-content { padding: 28px; flex: 1; }

        .mp-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 200; }
        .mp-overlay.show { display: block; }

        /* ── COMPONENTS ──────────────────────────── */
        .mp-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--r-lg); padding: 24px; margin-bottom: 20px;
        }
        .mp-card-title { font-family: var(--font-display); font-size: 1.08rem; color: var(--text); margin-bottom: 20px; }

        .mp-section-label { font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: var(--gold); margin-bottom: 12px; margin-top: 28px; }
        .mp-section-label:first-child { margin-top: 0; }

        /* Stats */
        .mp-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
        .mp-stat {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--r-lg); padding: 20px 18px; transition: border-color 0.2s;
        }
        .mp-stat:hover { border-color: rgba(201,168,76,0.2); }
        .mp-stat-label { font-size: 0.59rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted); margin-bottom: 9px; }
        .mp-stat-value { font-family: var(--font-display); font-size: 1.9rem; color: var(--text); line-height: 1; margin-bottom: 5px; }
        .mp-stat-sub   { font-size: 0.67rem; color: var(--text-muted); }

        /* Quick actions */
        .mp-actions { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
        .mp-action {
            background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg);
            padding: 20px 18px; cursor: pointer; display: block; width: 100%; text-align: left;
            font-family: var(--font-body); transition: background 0.2s, border-color 0.2s, transform 0.2s;
        }
        .mp-action:hover { background: var(--surface2); border-color: rgba(201,168,76,0.3); transform: translateY(-2px); }
        .mp-action-icon { font-size: 1.5rem; margin-bottom: 10px; }
        .mp-action-name { font-size: 0.84rem; font-weight: 700; color: var(--text); margin-bottom: 4px; }
        .mp-action-desc { font-size: 0.72rem; color: var(--text-dim); line-height: 1.55; }

        /* Welcome */
        .mp-welcome-tag { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: var(--gold); margin-bottom: 6px; }
        .mp-welcome-h   { font-family: var(--font-display); font-size: clamp(1.4rem, 3vw, 2.1rem); color: var(--text); margin-bottom: 6px; }
        .mp-welcome-meta{ font-size: 0.78rem; color: var(--text-muted); }

        /* Forms */
        .mp-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .mp-form-grid .full { grid-column: 1 / -1; }

        .mp-pfield { }
        .mp-pfield label { display: block; font-size: 0.64rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.3px; color: var(--text-muted); margin-bottom: 6px; }
        .mp-pfield input, .mp-pfield select, .mp-pfield textarea {
            width: 100%; background: var(--surface2);
            border: 1px solid rgba(255,255,255,0.09); border-radius: var(--r);
            padding: 10px 13px; font-size: 0.85rem; color: var(--text);
            font-family: var(--font-body); outline: none; transition: border-color 0.2s; -webkit-appearance: none;
        }
        .mp-pfield input:focus, .mp-pfield select:focus, .mp-pfield textarea:focus { border-color: rgba(201,168,76,0.5); }
        .mp-pfield input::placeholder { color: rgba(255,255,255,0.2); }
        .mp-pfield select option { background: #1a1a2e; }

        .mp-submit {
            padding: 11px 26px; background: linear-gradient(135deg, #c9a84c, #a07830);
            border: none; border-radius: var(--r); color: #fff; font-family: var(--font-body);
            font-size: 0.82rem; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase;
            cursor: pointer; transition: opacity 0.2s; margin-top: 16px;
        }
        .mp-submit:hover { opacity: 0.85; }
        .mp-submit.full { width: 100%; }

        .mp-vmsg { padding: 10px 14px; border-radius: var(--r); font-size: 0.79rem; margin-bottom: 14px; display: none; }
        .mp-vmsg.err { background: rgba(220,60,60,0.12); border: 1px solid rgba(220,60,60,0.25); color: #f87171; display: block; }
        .mp-vmsg.ok  { background: rgba(60,180,100,0.12); border: 1px solid rgba(60,180,100,0.25); color: #6ee7a0; display: block; }

        /* Tables */
        .mp-table-wrap { overflow-x: auto; }
        .mp-table { width: 100%; border-collapse: collapse; font-size: 0.81rem; }
        .mp-table th { padding: 10px 14px; text-align: left; font-size: 0.61rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); border-bottom: 1px solid var(--border); white-space: nowrap; }
        .mp-table td { padding: 11px 14px; color: var(--text-dim); border-bottom: 1px solid rgba(255,255,255,0.04); }
        .mp-table tr:last-child td { border-bottom: none; }
        .mp-table tr:hover td { background: rgba(255,255,255,0.02); }

        /* Badges */
        .mp-badge { display: inline-block; padding: 3px 9px; border-radius: 5px; font-size: 0.68rem; font-weight: 700; }
        .mp-badge.pending  { background: rgba(234,179,8,0.15);  color: #fbbf24; }
        .mp-badge.approved { background: rgba(34,197,94,0.15);  color: #4ade80; }
        .mp-badge.rejected { background: rgba(239,68,68,0.15);  color: #f87171; }

        .mp-act-btn { padding: 4px 11px; border-radius: 5px; font-size: 0.7rem; font-weight: 700; cursor: pointer; border: none; font-family: var(--font-body); }
        .mp-approve { background: rgba(34,197,94,0.18); color: #4ade80; }
        .mp-reject  { background: rgba(239,68,68,0.18); color: #f87171; margin-left: 5px; }

        /* Tabs */
        .mp-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
        .mp-tab {
            padding: 6px 14px; border-radius: 20px; font-size: 0.71rem; font-weight: 700;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.09);
            color: var(--text-muted); cursor: pointer; transition: all 0.2s; font-family: var(--font-body);
        }
        .mp-tab.active { background: var(--gold-bg); border-color: rgba(201,168,76,0.35); color: var(--gold); }

        /* Filters */
        .mp-filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
        .mp-filter {
            padding: 5px 13px; border-radius: 16px; font-size: 0.71rem; font-weight: 700;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.09);
            color: var(--text-muted); cursor: pointer; transition: all 0.2s; font-family: var(--font-body);
        }
        .mp-filter.active { background: var(--gold-bg); border-color: rgba(201,168,76,0.35); color: var(--gold); }

        /* Announcements */
        .mp-ann-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
        .mp-ann-card {
            background: var(--surface2); border: 1px solid var(--border);
            border-radius: var(--r-lg); padding: 20px 18px;
            display: flex; flex-direction: column; gap: 8px; transition: border-color 0.2s;
        }
        .mp-ann-card:hover { border-color: rgba(201,168,76,0.2); }
        .mp-ann-tag   { font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--gold); }
        .mp-ann-title { font-family: var(--font-display); font-size: 1rem; color: var(--text); }
        .mp-ann-body  { font-size: 0.8rem; color: var(--text-dim); line-height: 1.65; flex: 1; }
        .mp-ann-date  { font-size: 0.7rem; color: rgba(201,168,76,0.75); padding-top: 8px; border-top: 1px solid var(--border); }

        /* Profile */
        .mp-profile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 18px; }
        .mp-pinfo-label { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.3px; color: var(--text-muted); margin-bottom: 4px; }
        .mp-pinfo-value { font-size: 0.85rem; color: var(--text); }

        /* Leaders */
        .mp-leaders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
        .mp-leader-card {
            background: var(--surface2); border: 1px solid var(--border); border-radius: var(--r-lg);
            padding: 18px; display: flex; align-items: center; gap: 14px; transition: border-color 0.2s;
        }
        .mp-leader-card:hover { border-color: rgba(201,168,76,0.2); }
        .mp-leader-av {
            width: 48px; height: 48px; border-radius: 50%; flex-shrink: 0;
            background: linear-gradient(135deg, rgba(30,58,138,0.8), rgba(201,168,76,0.3));
            border: 2px solid rgba(201,168,76,0.3);
            display: flex; align-items: center; justify-content: center;
            font-family: var(--font-display); font-size: 1rem; color: rgba(255,255,255,0.75); font-weight: 700; overflow: hidden;
        }
        .mp-leader-av img { width: 100%; height: 100%; object-fit: cover; }
        .mp-leader-name   { font-size: 0.85rem; font-weight: 700; color: var(--text); margin-bottom: 2px; }
        .mp-leader-title  { font-size: 0.72rem; color: var(--gold); margin-bottom: 2px; }
        .mp-leader-branch { font-size: 0.68rem; color: var(--text-muted); }

        /* User mgmt avatar */
        .mp-tbl-av {
            width: 28px; height: 28px; border-radius: 50%;
            background: linear-gradient(135deg, rgba(30,58,138,0.7), rgba(201,168,76,0.3));
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 0.68rem; font-weight: 700; color: rgba(255,255,255,0.75);
            margin-right: 8px; vertical-align: middle; flex-shrink: 0;
        }

        /* Empty state */
        .mp-empty { text-align: center; padding: 48px 20px; color: var(--text-muted); font-size: 0.84rem; }
        .mp-empty-icon { font-size: 2.8rem; margin-bottom: 12px; opacity: 0.35; }

        /* ── RESPONSIVE ───────────────────────────── */
        @media (max-width: 768px) {
            .mp-sidebar { transform: translateX(-100%); }
            .mp-sidebar.open { transform: translateX(0); box-shadow: 6px 0 32px rgba(0,0,0,0.7); }
            .mp-main { margin-left: 0; }
            .mp-mob-toggle { display: block; }
            .mp-content { padding: 18px; }
            .mp-topbar { padding: 12px 18px; }
            .mp-topbar-greet { display: none; }
            .mp-form-grid { grid-template-columns: 1fr; }
            .mp-form-grid .full { grid-column: 1; }
        }
        @media (max-width: 480px) {
            .mp-auth-card { padding: 28px 18px; }
            .mp-row { grid-template-columns: 1fr; }
            .mp-role-grid { grid-template-columns: 1fr; }
            .mp-stats { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
<div id="mpPage"></div>
<script src="mockData.js"></script>
<script>
(function () {
    'use strict';

    /* ── CONSTANTS ───────────────────────────── */
    var CODES = { leader: 'TPM-LEADER-2026', admin: 'TPM-ADMIN-2026' };

    /* ── AUTH LAYER ──────────────────────────────
       Swap these functions for Firebase SDK calls
       when ready to go live.
    ─────────────────────────────────────────── */
    var Auth = {
        _usersKey:   'tpm_portal_users',
        _sessionKey: 'tpm_portal_session',

        getUsers: function () {
            try { return JSON.parse(localStorage.getItem(this._usersKey) || '[]'); } catch (e) { return []; }
        },
        saveUsers: function (users) {
            localStorage.setItem(this._usersKey, JSON.stringify(users));
        },
        findByEmail: function (email) {
            return this.getUsers().find(function (u) { return u.email === email.toLowerCase(); });
        },
        login: function (email, password, cb) {
            var user = this.findByEmail(email);
            if (!user || user.password !== password) { cb('Invalid email or password.'); return; }
            localStorage.setItem(this._sessionKey, JSON.stringify({ email: user.email }));
            cb(null, user);
        },
        register: function (data, cb) {
            var users = this.getUsers();
            if (users.some(function (u) { return u.email === data.email; })) {
                cb('An account with this email already exists.'); return;
            }
            users.push(data);
            this.saveUsers(users);
            localStorage.setItem(this._sessionKey, JSON.stringify({ email: data.email }));
            cb(null, data);
        },
        getSession: function () {
            try {
                var s = JSON.parse(localStorage.getItem(this._sessionKey) || 'null');
                return s ? (this.findByEmail(s.email) || null) : null;
            } catch (e) { return null; }
        },
        logout: function () { localStorage.removeItem(this._sessionKey); }
    };

    function vReports() {
        var d = DB.mock(); var branches = d.branches || [], types = d.meetingTypes || [];
        var tabMap  = { loucs:'LOUCS', basenia:'Basenia', friday:'Friday Service', general:'General Meeting', tithe:'Tithe', souls:'Souls Won' };
        var mockSrc = { loucs:d.loucsReport, basenia:d.baseniaReport, friday:d.fridayServiceReport, general:d.generalMeetingReport, tithe:d.titheRecords, souls:d.soulsWonReport };
        var submitted = DB.getReports().filter(function (r) { return r.meetingType === tabMap[activeReportTab]; });
        var combined  = (mockSrc[activeReportTab] || []).concat(submitted);
        var isSouls = activeReportTab === 'souls', isTithe = activeReportTab === 'tithe';

        var rows = combined.length ? combined.map(function (r) {
            var aM = Number(r.attMale || 0), aF = Number(r.attFemale || 0);
            var sM = Number(r.soulsMale || 0), sF = Number(r.soulsFemale || 0);
            return '<tr><td>' + esc(r.date || '') + '</td><td>' + esc(r.branch || '') + '</td>' +
                '<td>' + fmt(aM) + '</td><td>' + fmt(aF) + '</td><td><strong>' + fmt(aM + aF) + '</strong></td>' +
                (isTithe ? '<td>GH₵ ' + fmt(r.tithe) + '</td>' : '') +
                (isSouls ? '<td>' + fmt(sM) + '</td><td>' + fmt(sF) + '</td><td><strong>' + fmt(sM + sF) + '</strong></td>' : '') +
                '<td>' + esc(r.notes || '—') + '</td></tr>';
        }).join('') : '<tr><td colspan="9" style="text-align:center;color:var(--text-muted);padding:32px">No records yet</td></tr>';

        var tabs = Object.keys(tabMap).map(function (k) {
            return '<button class="mp-tab' + (activeReportTab === k ? ' active' : '') + '" data-rtab="' + k + '">' + tabMap[k] + '</button>';
        }).join('');

        $('mpContent').innerHTML =
            '<div class="mp-card">' +
                '<h2 class="mp-card-title">Submit New Record</h2>' +
                '<div class="mp-vmsg" id="rptMsg"></div>' +
                '<form id="rptForm">' +
                    '<div class="mp-form-grid">' +
                        '<div class="mp-pfield"><label>Record Type *</label><select id="rType"><option value="">Select type</option>' + types.map(function (t) { return '<option>' + esc(t) + '</option>'; }).join('') + '</select></div>' +
                        '<div class="mp-pfield"><label>Branch *</label><select id="rBranch"><option value="">Select branch</option>' + branches.map(function (b) { return '<option>' + esc(b) + '</option>'; }).join('') + '</select></div>' +
                        '<div class="mp-pfield"><label>Date *</label><input type="date" id="rDate"></div>' +
                        '<div class="mp-pfield"><label>Attendance — Male</label><input type="number" id="rAttM" min="0" placeholder="0"></div>' +
                        '<div class="mp-pfield"><label>Attendance — Female</label><input type="number" id="rAttF" min="0" placeholder="0"></div>' +
                        '<div class="mp-pfield"><label>Tithe (GH₵)</label><input type="number" id="rTithe" min="0" step="0.01" placeholder="0.00"></div>' +
                        '<div class="mp-pfield"><label>Souls Won — Male</label><input type="number" id="rSoulsM" min="0" placeholder="0"></div>' +
                        '<div class="mp-pfield"><label>Souls Won — Female</label><input type="number" id="rSoulsF" min="0" placeholder="0"></div>' +
                        '<div class="mp-pfield full"><label>Notes</label><input type="text" id="rNotes" placeholder="Optional notes"></div>' +
                    '</div>' +
                    '<button type="submit" class="mp-submit">Submit Record</button>' +
                '</form>' +
            '</div>' +
            '<div class="mp-card">' +
                '<h2 class="mp-card-title">Records</h2>' +
                '<div class="mp-tabs">' + tabs + '</div>' +
                '<div class="mp-table-wrap"><table class="mp-table"><thead><tr>' +
                '<th>Date</th><th>Branch</th><th>Male</th><th>Female</th><th>Total</th>' +
                (isTithe ? '<th>Tithe</th>' : '') +
                (isSouls ? '<th>Souls M</th><th>Souls F</th><th>Souls Total</th>' : '') +
                '<th>Notes</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
            '</div>';

        $('mpContent').querySelectorAll('.mp-tab').forEach(function (p) {
            p.onclick = function () { activeReportTab = this.getAttribute('data-rtab'); vReports(); };
        });
        $('rptForm').onsubmit = function (e) {
            e.preventDefault();
            var type = $('rType').value, branch = $('rBranch').value, date = $('rDate').value;
            if (!type || !branch || !date) { showVMsg('rptMsg', 'err', 'Please fill in Record Type, Branch, and Date.'); return; }
            var aM = Number($('rAttM').value || 0), aF = Number($('rAttF').value || 0);
            var sM = Number($('rSoulsM').value || 0), sF = Number($('rSoulsF').value || 0);
            var rpts = DB.getReports();
            rpts.push({ meetingType: type, branch: branch, date: date, attMale: aM, attFemale: aF, tithe: $('rTithe').value || 0, soulsMale: sM, soulsFemale: sF, notes: $('rNotes').value || '' });
            DB.saveReports(rpts);
            showVMsg('rptMsg', 'ok', 'Record submitted successfully!');
            $('rptForm').reset();
            setTimeout(vReports, 1200);
        };
    }

    function vRegistry() {
        var d = DB.mock();
        $('mpContent').innerHTML =
            '<div class="mp-card">' +
                '<h2 class="mp-card-title">Register New Member</h2>' +
                '<div class="mp-vmsg" id="memMsg"></div>' +
                '<form id="memForm">' +
                    '<div class="mp-form-grid">' +
                        '<div class="mp-pfield"><label>First Name *</label><input type="text" id="m_first" placeholder="First name"></div>' +
                        '<div class="mp-pfield"><label>Middle Name</label><input type="text" id="m_mid" placeholder="Optional"></div>' +
                        '<div class="mp-pfield"><label>Last Name *</label><input type="text" id="m_last" placeholder="Last name"></div>' +
                        '<div class="mp-pfield"><label>Date of Birth *</label><input type="date" id="m_dob"></div>' +
                        '<div class="mp-pfield"><label>Gender *</label><select id="m_gender"><option value="">Select</option><option>Male</option><option>Female</option></select></div>' +
                        '<div class="mp-pfield"><label>Phone *</label><input type="tel" id="m_phone" placeholder="+233 XX XXX XXXX"></div>' +
                        '<div class="mp-pfield"><label>Email</label><input type="email" id="m_email" placeholder="email@example.com"></div>' +
                        '<div class="mp-pfield full"><label>Home Address *</label><input type="text" id="m_addr" placeholder="Home address"></div>' +
                        '<div class="mp-pfield"><label>Branch *</label><select id="m_branch"><option value="">Select branch</option>' + (d.branches || []).map(function (b) { return '<option>' + esc(b) + '</option>'; }).join('') + '</select></div>' +
                        '<div class="mp-pfield"><label>Department *</label><select id="m_dept"><option value="">Select department</option>' + (d.departments || []).map(function (x) { return '<option>' + esc(x) + '</option>'; }).join('') + '</select></div>' +
                        '<div class="mp-pfield"><label>Fellowship</label><select id="m_fellow"><option value="">Optional</option>' + (d.fellowships || []).map(function (x) { return '<option>' + esc(x) + '</option>'; }).join('') + '</select></div>' +
                        '<div class="mp-pfield"><label>Date Joined *</label><input type="date" id="m_joined"></div>' +
                        '<div class="mp-pfield"><label>Membership Status *</label><select id="m_status"><option value="">Select status</option>' + (d.membershipStatuses || []).map(function (x) { return '<option>' + esc(x) + '</option>'; }).join('') + '</select></div>' +
                        '<div class="mp-pfield"><label>Emergency Contact Name *</label><input type="text" id="m_ecname" placeholder="Full name"></div>' +
                        '<div class="mp-pfield"><label>Emergency Contact Phone *</label><input type="tel" id="m_ecphone" placeholder="+233 XX XXX XXXX"></div>' +
                    '</div>' +
                    '<button type="submit" class="mp-submit">Register Member</button>' +
                '</form>' +
            '</div>';

        $('memForm').onsubmit = function (e) {
            e.preventDefault();
            var first = $('m_first').value.trim(), last = $('m_last').value.trim();
            var dob = $('m_dob').value, gender = $('m_gender').value;
            var phone = $('m_phone').value.trim(), addr = $('m_addr').value.trim();
            var branch = $('m_branch').value, dept = $('m_dept').value;
            var joined = $('m_joined').value, status = $('m_status').value;
            var ecname = $('m_ecname').value.trim(), ecphone = $('m_ecphone').value.trim();
            if (!first || !last || !dob || !gender || !phone || !addr || !branch || !dept || !joined || !status || !ecname || !ecphone) {
                showVMsg('memMsg', 'err', 'Please fill in all required fields.'); return;
            }
            var email = ($('m_email').value || '').trim().toLowerCase();
            var key = 'tpm_member_' + (email || phone);
            localStorage.setItem(key, JSON.stringify({
                firstName: first, middleName: $('m_mid').value.trim(), lastName: last,
                dob: dob, gender: gender, phone: phone, email: email, address: addr,
                branch: branch, department: dept, fellowship: $('m_fellow').value,
                dateJoined: joined, membershipStatus: status,
                emergencyContactName: ecname, emergencyContactPhone: ecphone,
                registeredAt: new Date().toISOString()
            }));
            showVMsg('memMsg', 'ok', first + ' ' + last + ' registered successfully!');
            $('memForm').reset();
        };
    }

    function vStatistics() {
        var d = DB.mock(); var stats = d.statistics || {}, trends = d.attendanceTrends || {}, bc = d.branchComparisons || {};
        var tabMap  = { loucs:'LOUCS', basenia:'Basenia', friday:'Friday Service', general:'General Meeting', tithe:'Tithe', souls:'Souls Won' };
        var mockSrc = { loucs:d.loucsReport, basenia:d.baseniaReport, friday:d.fridayServiceReport, general:d.generalMeetingReport, tithe:d.titheRecords, souls:d.soulsWonReport };
        var isSouls = activeReportTab === 'souls', isTithe = activeReportTab === 'tithe';

        var tabs = Object.keys(tabMap).map(function (k) {
            return '<button class="mp-tab' + (activeReportTab === k ? ' active' : '') + '" data-stab="' + k + '">' + tabMap[k] + '</button>';
        }).join('');

        var rows = (mockSrc[activeReportTab] || []).map(function (r) {
            var aM = Number(r.attMale || 0), aF = Number(r.attFemale || 0);
            var sM = Number(r.soulsMale || 0), sF = Number(r.soulsFemale || 0);
            return '<tr><td>' + esc(r.date || '') + '</td><td>' + esc(r.branch || '') + '</td>' +
                '<td>' + fmt(aM) + '</td><td>' + fmt(aF) + '</td><td><strong>' + fmt(aM + aF) + '</strong></td>' +
                (isTithe ? '<td>GH₵ ' + fmt(r.tithe) + '</td>' : '') +
                (isSouls ? '<td>' + fmt(sM) + '</td><td>' + fmt(sF) + '</td><td><strong>' + fmt(sM + sF) + '</strong></td>' : '') +
                '<td>' + esc(r.notes || '—') + '</td></tr>';
        }).join('') || '<tr><td colspan="9" style="text-align:center;color:var(--text-muted);padding:32px">No data</td></tr>';

        $('mpContent').innerHTML =
            '<div class="mp-stats" style="margin-bottom:24px">' +
                mpStat('Total Members', fmt(stats.totalMembers),         'registered') +
                mpStat('This Week',     fmt(stats.attendanceThisWeek),   'attendance') +
                mpStat('Tithe',         'GH₵ ' + fmt(stats.titheThisMonth), 'this month') +
                mpStat('Souls Won',     fmt(stats.soulsWon),             'this month') +
            '</div>' +
            '<div class="mp-card"><h2 class="mp-card-title">Attendance Trend</h2><canvas id="trendChart" height="80"></canvas></div>' +
            '<div class="mp-card"><h2 class="mp-card-title">Branch Attendance</h2><canvas id="branchChart" height="80"></canvas></div>' +
            '<div class="mp-card">' +
                '<h2 class="mp-card-title">Detailed Records</h2>' +
                '<div class="mp-tabs">' + tabs + '</div>' +
                '<div class="mp-table-wrap"><table class="mp-table"><thead><tr>' +
                '<th>Date</th><th>Branch</th><th>Male</th><th>Female</th><th>Total</th>' +
                (isTithe ? '<th>Tithe</th>' : '') +
                (isSouls ? '<th>Souls M</th><th>Souls F</th><th>Souls Total</th>' : '') +
                '<th>Notes</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
            '</div>';

        $('mpContent').querySelectorAll('.mp-tab').forEach(function (p) {
            p.onclick = function () { activeReportTab = this.getAttribute('data-stab'); vStatistics(); };
        });

        var chartOpts = {
            plugins: { legend: { display: false } },
            scales: {
                x: { ticks: { color: 'rgba(255,255,255,.35)', font: { size: 11 } }, grid: { color: 'rgba(255,255,255,.05)' } },
                y: { ticks: { color: 'rgba(255,255,255,.35)', font: { size: 11 } }, grid: { color: 'rgba(255,255,255,.05)' } }
            }
        };
        setTimeout(function () {
            var tc = $('trendChart'), bc2 = $('branchChart');
            if (tc && window.Chart) chartInsts.push(new Chart(tc, { type:'line', data:{ labels: trends.labels||[], datasets:[{ data: trends.data||[], borderColor:'#c9a84c', backgroundColor:'rgba(201,168,76,.07)', tension:.4, fill:true, pointBackgroundColor:'#c9a84c', pointRadius:4 }] }, options: chartOpts }));
            if (bc2 && window.Chart) chartInsts.push(new Chart(bc2, { type:'bar',  data:{ labels: bc.labels||[], datasets:[{ data: bc.attendance||[], backgroundColor:'rgba(59,130,246,.45)', borderColor:'rgba(59,130,246,.8)', borderWidth:1, borderRadius:5 }] }, options: chartOpts }));
        }, 60);
    }

    function vLeaders() {
        var leaders = DB.mock().leaders || [];
        $('mpContent').innerHTML = leaders.length
            ? '<div class="mp-leaders-grid">' + leaders.map(function (l) {
                var av = l.photo ? '<img src="' + esc(l.photo) + '" alt="' + esc(l.name) + '">' : initials(l.name);
                return '<div class="mp-leader-card"><div class="mp-leader-av">' + av + '</div>' +
                    '<div><div class="mp-leader-name">' + esc(l.name) + '</div>' +
                    '<div class="mp-leader-title">' + esc(l.title) + '</div>' +
                    '<div class="mp-leader-branch">📍 ' + esc(l.branch) + '</div></div></div>';
            }).join('') + '</div>'
            : '<div class="mp-empty"><div class="mp-empty-icon">🏛️</div>No leaders found.</div>';
    }

    function vRequests() {
        var all      = DB.getRequests();
        var filters  = ['all','pending','approved','rejected'];
        var filtered = activeReqFilter === 'all' ? all : all.filter(function (r) { return r.status.toLowerCase() === activeReqFilter; });

        var filterBtns = filters.map(function (f) {
            var count = f === 'all' ? all.length : all.filter(function (r) { return r.status.toLowerCase() === f; }).length;
            return '<button class="mp-filter' + (activeReqFilter === f ? ' active' : '') + '" data-rf="' + f + '">' + f.charAt(0).toUpperCase() + f.slice(1) + ' (' + count + ')</button>';
        }).join('');

        var rows = filtered.length ? filtered.map(function (r) {
            var p = r.status === 'Pending';
            return '<tr>' +
                '<td>' + esc(r.memberName || '') + '</td>' +
                '<td>' + esc(r.field || '') + '</td>' +
                '<td style="color:var(--text-muted);text-decoration:line-through">' + esc(r.oldValue || '') + '</td>' +
                '<td style="color:#6ee7a0">' + esc(r.newValue || '') + '</td>' +
                '<td><span class="mp-badge ' + r.status.toLowerCase() + '">' + r.status + '</span></td>' +
                '<td>' + esc(r.date || '') + '</td>' +
                '<td>' + (p ? '<button class="mp-act-btn mp-approve" data-id="' + r.id + '" data-action="Approved">Approve</button><button class="mp-act-btn mp-reject" data-id="' + r.id + '" data-action="Rejected">Reject</button>' : '—') + '</td>' +
            '</tr>';
        }).join('') : '<tr><td colspan="7" style="text-align:center;color:var(--text-muted);padding:32px">No requests found</td></tr>';

        $('mpContent').innerHTML =
            '<div class="mp-card">' +
                '<h2 class="mp-card-title">Profile Update Requests</h2>' +
                '<div class="mp-filters">' + filterBtns + '</div>' +
                '<div class="mp-table-wrap"><table class="mp-table"><thead><tr><th>Member</th><th>Field</th><th>Old Value</th><th>New Value</th><th>Status</th><th>Date</th><th>Action</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
            '</div>';

        $('mpContent').querySelectorAll('.mp-filter').forEach(function (b) {
            b.onclick = function () { activeReqFilter = this.getAttribute('data-rf'); vRequests(); };
        });
        $('mpContent').querySelectorAll('.mp-act-btn').forEach(function (b) {
            b.onclick = function () {
                var id = parseInt(this.getAttribute('data-id')), action = this.getAttribute('data-action');
                var reqs = DB.getRequests(), req = reqs.find(function (r) { return r.id === id; });
                if (req) req.status = action;
                DB.saveRequests(reqs); vRequests();
            };
        });
    }

    function vUsers() {
        var users = Auth.getUsers();
        var rows  = users.length ? users.map(function (u) {
            return '<tr>' +
                '<td><span class="mp-tbl-av">' + initials(u.fullName) + '</span>' + esc(u.fullName) + '</td>' +
                '<td>' + esc(u.email) + '</td>' +
                '<td><span class="mp-role-badge ' + u.role + '">' + esc(u.role) + '</span></td>' +
                '<td>' + esc(u.branch || '—') + '</td>' +
                '<td>' + esc(u.department || '—') + '</td>' +
                '<td>' + esc(u.dateJoined || '—') + '</td>' +
            '</tr>';
        }).join('') : '<tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:32px">No users registered yet</td></tr>';

        $('mpContent').innerHTML =
            '<div class="mp-card">' +
                '<h2 class="mp-card-title">All Portal Users</h2>' +
                '<div class="mp-table-wrap"><table class="mp-table"><thead><tr>' +
                '<th>Name</th><th>Email</th><th>Role</th><th>Branch</th><th>Department</th><th>Date Joined</th>' +
                '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
            '</div>';
    }

    /* ── HELPERS ─────────────────────────────── */
    function mpStat(label, value, sub) {
        return '<div class="mp-stat">' +
            '<div class="mp-stat-label">' + esc(label) + '</div>' +
            '<div class="mp-stat-value">' + value + '</div>' +
            '<div class="mp-stat-sub">' + esc(sub) + '</div>' +
            '</div>';
    }

    /* ── BOOT ────────────────────────────────── */
    document.addEventListener('DOMContentLoaded', function () {
        var user = Auth.getSession();
        if (user) {
            var saved = sessionStorage.getItem('tpm_portal_view');
            if (saved) activeView = saved;
            renderPortal();
        } else {
            renderAuth();
        }
    });

    window.addEventListener('beforeunload', function () {
        sessionStorage.setItem('tpm_portal_view', activeView);
    });

})();
</script>
</body>
</html>
