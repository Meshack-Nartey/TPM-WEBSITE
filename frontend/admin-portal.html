<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="assets/images/TPM LOGO ONE.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal — Transformation Project Ministries</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:       #080808;
            --surface:  #111111;
            --surface2: #181818;
            --border:   rgba(255,255,255,0.06);
            --gold:     #c9a84c;
            --gold-bg:  rgba(201,168,76,0.1);
            --text:     #f0f0f0;
            --text-dim: rgba(255,255,255,0.55);
            --text-muted: rgba(255,255,255,0.28);
            --sidebar:  220px;
            --r:        10px;
            --r-lg:     16px;
            --font-body: 'Montserrat', sans-serif;
            --font-display: 'Playfair Display', serif;
        }

        body { font-family: var(--font-body); background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }

        /* ── AUTH ─────────────────────────────────── */
        .ap-auth {
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 40px 20px;
            background:
                radial-gradient(ellipse at 10% 10%, rgba(201,168,76,0.07) 0%, transparent 55%),
                radial-gradient(ellipse at 90% 90%, rgba(30,58,138,0.09) 0%, transparent 55%),
                var(--bg);
        }

        .ap-auth-card {
            width: 100%; max-width: 440px;
            background: var(--surface);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: var(--r-lg);
            padding: 40px 36px;
            box-shadow: 0 32px 64px rgba(0,0,0,0.6);
        }

        .ap-auth-logo { text-align: center; margin-bottom: 26px; }
        .ap-auth-logo img { height: 44px; object-fit: contain; }
        .ap-auth-logo-sub { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2.5px; color: var(--gold); margin-top: 8px; }

        .ap-auth-h   { font-family: var(--font-display); font-size: 1.5rem; color: var(--text); text-align: center; margin-bottom: 4px; }
        .ap-auth-sub { font-size: 0.75rem; color: var(--text-muted); text-align: center; margin-bottom: 24px; }

        .ap-field { margin-bottom: 14px; }
        .ap-field label { display: block; font-size: 0.64rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.4px; color: var(--text-muted); margin-bottom: 6px; }
        .ap-field input, .ap-field select, .ap-field textarea {
            width: 100%; background: var(--surface2);
            border: 1px solid rgba(255,255,255,0.09); border-radius: var(--r);
            padding: 11px 14px; font-size: 0.85rem; color: var(--text);
            font-family: var(--font-body); outline: none; transition: border-color 0.2s; -webkit-appearance: none;
        }
        .ap-field textarea { resize: vertical; min-height: 90px; }
        .ap-field input:focus, .ap-field select:focus, .ap-field textarea:focus { border-color: rgba(201,168,76,0.5); }
        .ap-field input::placeholder, .ap-field textarea::placeholder { color: rgba(255,255,255,0.2); }
        .ap-field-hint { font-size: 0.68rem; color: var(--text-muted); margin-top: 6px; line-height: 1.5; }
        .ap-field select option { background: #1a1a2e; }

        .ap-switch-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 11px 14px; background: var(--surface2);
            border: 1px solid rgba(255,255,255,0.09); border-radius: var(--r);
            margin-bottom: 14px;
        }
        .ap-switch-row span { font-size: 0.85rem; }
        .ap-switch-row input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--gold); cursor: pointer; }

        .ap-btn {
            padding: 11px 22px; border: none; border-radius: var(--r);
            background: linear-gradient(135deg, #c9a84c, #a07830);
            color: #fff; font-family: var(--font-body); font-size: 0.82rem;
            font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase;
            cursor: pointer; transition: opacity 0.2s, transform 0.1s;
        }
        .ap-btn:hover { opacity: 0.88; }
        .ap-btn:active { transform: scale(0.99); }
        .ap-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .ap-btn.full { width: 100%; }
        .ap-btn.ghost {
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.09);
            color: var(--text-dim); font-weight: 600;
        }
        .ap-btn.ghost:hover { background: rgba(255,255,255,0.08); color: var(--text); opacity: 1; }
        .ap-btn.danger { background: rgba(220,60,60,0.12); border: 1px solid rgba(220,60,60,0.3); color: #f87171; }
        .ap-btn.danger:hover { background: rgba(220,60,60,0.2); opacity: 1; }
        .ap-btn-row { display: flex; gap: 10px; margin-top: 4px; }
        .ap-btn-row .ap-btn { flex: 1; }

        .ap-msg { padding: 10px 14px; border-radius: var(--r); font-size: 0.79rem; margin-bottom: 14px; display: none; }
        .ap-msg.err { background: rgba(220,60,60,0.12); border: 1px solid rgba(220,60,60,0.25); color: #f87171; display: block; }
        .ap-msg.ok  { background: rgba(60,180,100,0.12); border: 1px solid rgba(60,180,100,0.25); color: #6ee7a0; display: block; }

        /* ── SHELL ────────────────────────────────── */
        .ap-topbar {
            padding: 14px 28px;
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 14px;
            background: var(--surface);
            position: sticky; top: 0; z-index: 100;
        }
        .ap-topbar img { height: 28px; object-fit: contain; }
        .ap-topbar-title { font-family: var(--font-display); font-size: 1rem; }
        .ap-topbar-sub { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.8px; color: var(--gold); }
        .ap-topbar-user { margin-left: auto; font-size: 0.78rem; color: var(--text-muted); display: flex; align-items: center; gap: 12px; }

        .ap-shell { display: flex; align-items: flex-start; }

        .ap-nav {
            width: var(--sidebar); flex-shrink: 0;
            padding: 20px 12px;
            display: flex; flex-direction: column; gap: 3px;
            position: sticky; top: 57px;
        }
        .ap-nav-btn {
            display: flex; align-items: center; gap: 10px;
            width: 100%; padding: 10px 12px; background: none; border: none; border-radius: 8px;
            color: var(--text-dim); font-size: 0.82rem; font-weight: 600;
            cursor: pointer; text-align: left; font-family: var(--font-body);
            transition: background 0.15s, color 0.15s;
        }
        .ap-nav-btn:hover { background: rgba(255,255,255,0.05); color: var(--text); }
        .ap-nav-btn.active { background: var(--gold-bg); color: var(--gold); }

        .ap-content { flex: 1; min-width: 0; max-width: 760px; margin: 0 auto; padding: 32px 24px 80px; }

        .ap-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--r-lg); padding: 24px; margin-bottom: 22px;
        }
        .ap-card-title { font-family: var(--font-display); font-size: 1.1rem; margin-bottom: 4px; }
        .ap-card-sub { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 20px; }

        .ap-list { display: flex; flex-direction: column; gap: 10px; }
        .ap-row {
            display: flex; align-items: center; gap: 14px;
            padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--r);
            background: var(--surface2); cursor: pointer; transition: border-color 0.15s;
        }
        .ap-row:hover { border-color: rgba(201,168,76,0.3); }
        .ap-row-thumb {
            width: 46px; height: 46px; border-radius: 8px; object-fit: cover; flex-shrink: 0;
            background: rgba(255,255,255,0.05);
        }
        .ap-row-thumb-empty {
            width: 46px; height: 46px; border-radius: 8px; flex-shrink: 0;
            background: var(--gold-bg); display: flex; align-items: center; justify-content: center;
            color: var(--gold); font-size: 0.65rem; font-weight: 700; text-align: center;
        }
        .ap-row-main { flex: 1; min-width: 0; }
        .ap-row-title { font-size: 0.86rem; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ap-row-meta { font-size: 0.71rem; color: var(--text-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ap-row-chevron { color: var(--text-muted); font-size: 1.1rem; flex-shrink: 0; }
        .ap-tag {
            display: inline-block; padding: 2px 8px; border-radius: 20px;
            background: var(--gold-bg); color: var(--gold); font-size: 0.62rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.5px; margin-right: 6px;
        }

        .ap-empty { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 0.84rem; }

        .ap-hidden { display: none !important; }

        @media (max-width: 760px) {
            .ap-nav { position: static; width: 100%; flex-direction: row; flex-wrap: wrap; top: 0; padding: 14px 16px 0; }
            .ap-nav-btn { width: auto; }
            .ap-shell { flex-direction: column; }
            .ap-content { max-width: none; }
            .ap-topbar-user span:not(.ap-logout-label) { display: none; }
        }
    </style>
</head>
<body>

    <!-- ═══ LOGIN SCREEN ═══ -->
    <div class="ap-auth" id="authScreen">
        <div class="ap-auth-card">
            <div class="ap-auth-logo">
                <img src="assets/images/TPM LOGO WHITE.png" alt="TPM Logo">
                <div class="ap-auth-logo-sub">Admin Portal</div>
            </div>
            <h1 class="ap-auth-h">Sign in</h1>
            <p class="ap-auth-sub">Leaders and administrators only.</p>

            <div class="ap-msg" id="loginMsg"></div>

            <form id="loginForm">
                <div class="ap-field">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" required autocomplete="username">
                </div>
                <div class="ap-field">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" required autocomplete="current-password">
                </div>
                <button type="submit" class="ap-btn full" id="loginBtn">Sign in</button>
            </form>
        </div>
    </div>

    <!-- ═══ DASHBOARD ═══ -->
    <div id="dashboard" class="ap-hidden">
        <div class="ap-topbar">
            <img src="assets/images/TPM LOGO WHITE.png" alt="TPM Logo">
            <div>
                <div class="ap-topbar-title">Admin Portal</div>
                <div class="ap-topbar-sub" id="topbarSection">Announcements</div>
            </div>
            <div class="ap-topbar-user">
                <span id="userLabel"></span>
                <button class="ap-btn ghost" id="logoutBtn"><span class="ap-logout-label">Sign out</span></button>
            </div>
        </div>

        <div class="ap-shell">
            <nav class="ap-nav" id="sectionNav"></nav>
            <div class="ap-content" id="sectionContent"></div>
        </div>
    </div>

    <script>
        // Local dev only — see backend/.env CORS_ORIGINS; the deployed backend
        // isn't live yet (see the app's memory notes: Railway deferred).
        const API_BASE = 'http://localhost:4000';
        const SESSION_KEY = 'tpm_admin_portal_session';

        // ── Section configuration ──────────────────────────────────────────
        // One generic list+form engine (below) driven by these configs,
        // rather than separate markup/JS per content type — mirrors the
        // mobile app's ContentListScreen/content_manager.dart, field for
        // field, so the two admin surfaces stay in sync by construction.
        const SECTIONS = [
            {
                key: 'announcements',
                navLabel: 'Announcements',
                title: 'Announcements',
                addLabel: 'Post an announcement',
                listLabel: 'Published announcements',
                description: 'Adding a flyer image URL also puts this in the mobile app\'s Home carousel and this site\'s Announcements page.',
                apiPath: '/api/announcements',
                dataKey: 'announcements',
                itemKey: 'announcement',
                roles: ['LEADER', 'ADMIN'],
                thumbField: 'flyer',
                titleOf: (i) => i.title,
                subtitleOf: (i) => (i.tag ? i.tag + ' · ' : '') + (i.date || ''),
                extraPayload: () => ({ date: todayLabel() }),
                fields: [
                    { key: 'tag', label: 'Tag', type: 'select', options: ['Upcoming Event', 'Camp', 'Weekly Service', 'Conference', 'Prayer'] },
                    { key: 'title', label: 'Title', hint: 'Give it a clear title', required: true },
                    { key: 'body', label: 'Message', type: 'textarea', hint: 'Write the announcement…', required: true },
                    { key: 'flyer', label: 'Flyer image URL (optional)', hint: 'A link to a hosted image' },
                ],
            },
            {
                key: 'branches',
                navLabel: 'Branches',
                title: 'Branches',
                addLabel: 'Add a branch',
                listLabel: 'Branch directory',
                apiPath: '/api/branches',
                dataKey: 'branches',
                itemKey: 'branch',
                roles: ['ADMIN'],
                titleOf: (i) => i.name,
                subtitleOf: (i) => i.address || '',
                fields: [
                    { key: 'name', label: 'Name', hint: 'e.g. DAYSPRING', required: true },
                    { key: 'region', label: 'Region', hint: 'e.g. Branch', required: true },
                    { key: 'address', label: 'Address', hint: 'e.g. MC3V+2JF, Kumasi', required: true },
                    { key: 'phone', label: 'Phone', hint: 'Optional' },
                    { key: 'email', label: 'Email', hint: 'Optional' },
                ],
            },
            {
                key: 'workerGroups',
                navLabel: 'Worker Groups',
                title: 'Worker groups',
                addLabel: 'Add a worker group',
                listLabel: 'Worker group details',
                apiPath: '/api/worker-groups',
                dataKey: 'workerGroups',
                itemKey: 'workerGroup',
                roles: ['ADMIN'],
                thumbField: 'photo',
                titleOf: (i) => i.name,
                subtitleOf: (i) => i.blurb || '',
                fields: [
                    { key: 'name', label: 'Name', hint: 'e.g. Ushering', required: true },
                    { key: 'photo', label: 'Photo image URL', hint: 'A link to a hosted image', required: true },
                    { key: 'blurb', label: 'Description', type: 'textarea', hint: 'What this group does', required: true },
                ],
            },
            {
                key: 'givingChannels',
                navLabel: 'Giving Channels',
                title: 'Giving channels',
                addLabel: 'Add a giving channel',
                listLabel: 'Giving channels',
                apiPath: '/api/giving-channels',
                dataKey: 'channels',
                itemKey: 'channel',
                roles: ['ADMIN'],
                thumbField: 'logo',
                titleOf: (i) => i.name,
                subtitleOf: (i) => (i.numberLabel ? i.numberLabel + ': ' : '') + (i.number || ''),
                fields: [
                    { key: 'name', label: 'Name', hint: 'e.g. MTN Mobile Money', required: true },
                    { key: 'logo', label: 'Logo image URL', hint: 'A link to a hosted image', required: true },
                    { key: 'accountName', label: 'Account name', hint: 'Whose account it is', required: true },
                    { key: 'number', label: 'Number', hint: 'e.g. 055 447 6730', required: true },
                    { key: 'numberLabel', label: 'Number label', hint: 'e.g. Pay ID, Number, Account Number', required: true },
                ],
                boolFields: [
                    { key: 'isBank', label: 'Bank account' },
                ],
            },
            {
                key: 'books',
                navLabel: 'Books',
                title: 'Books & Resources',
                addLabel: 'Add a book',
                listLabel: 'Books & Resources',
                apiPath: '/api/books',
                dataKey: 'books',
                itemKey: 'book',
                roles: ['ADMIN'],
                thumbField: 'cover',
                titleOf: (i) => i.title,
                subtitleOf: (i) => i.author || '',
                fields: [
                    { key: 'title', label: 'Title', hint: 'e.g. Crossing the Red Sea', required: true },
                    { key: 'author', label: 'Author', hint: 'e.g. TPM Discipleship', required: true },
                    { key: 'cover', label: 'Cover image URL', hint: 'A link to a hosted image', required: true },
                ],
            },
            {
                key: 'events',
                navLabel: 'Events',
                title: 'Events',
                addLabel: 'Add an event',
                listLabel: 'Events',
                apiPath: '/api/events',
                dataKey: 'events',
                itemKey: 'event',
                roles: ['ADMIN'],
                thumbField: 'image',
                titleOf: (i) => i.title,
                subtitleOf: (i) => i.when || '',
                fields: [
                    { key: 'title', label: 'Title', hint: 'e.g. Transformation Sunday', required: true },
                    { key: 'tag', label: 'Tag', hint: 'e.g. Conference, Sunday', required: true },
                    { key: 'location', label: 'Location', hint: 'e.g. All branches', required: true },
                    { key: 'when', label: 'When', hint: 'e.g. Saturday 5th September · 8:00 AM', required: true },
                    { key: 'day', label: 'Day badge', hint: 'e.g. 05 — optional, leave blank for TBA' },
                    { key: 'month', label: 'Month badge', hint: 'e.g. Sep — optional, leave blank for TBA' },
                    { key: 'description', label: 'Description', type: 'textarea', hint: 'What the event is about', required: true },
                    { key: 'image', label: 'Flyer image URL', hint: 'A link to a hosted image', required: true },
                ],
            },
        ];

        const authScreen = document.getElementById('authScreen');
        const dashboard = document.getElementById('dashboard');
        const loginForm = document.getElementById('loginForm');
        const loginMsg = document.getElementById('loginMsg');
        const loginBtn = document.getElementById('loginBtn');
        const userLabel = document.getElementById('userLabel');
        const logoutBtn = document.getElementById('logoutBtn');
        const sectionNav = document.getElementById('sectionNav');
        const sectionContent = document.getElementById('sectionContent');
        const topbarSection = document.getElementById('topbarSection');

        let activeSection = SECTIONS[0].key;
        let editingItem = null; // the item currently loaded into the form, if editing

        function getSession() {
            try {
                const raw = sessionStorage.getItem(SESSION_KEY);
                return raw ? JSON.parse(raw) : null;
            } catch (e) {
                return null;
            }
        }

        function setSession(session) {
            sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));
        }

        function clearSession() {
            sessionStorage.removeItem(SESSION_KEY);
        }

        function showMsg(el, text, type) {
            el.textContent = text;
            el.className = 'ap-msg ' + type;
        }

        function hideMsg(el) {
            el.className = 'ap-msg';
            el.textContent = '';
        }

        async function apiFetch(path, options) {
            options = options || {};
            const session = getSession();
            const headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
            if (session && session.token) headers.Authorization = 'Bearer ' + session.token;

            let response;
            try {
                response = await fetch(API_BASE + path, Object.assign({}, options, { headers }));
            } catch (e) {
                throw new Error("Can't reach the server. Make sure the API is running.");
            }

            let data = {};
            try {
                data = await response.json();
            } catch (e) {
                // Empty body (e.g. a 204/ok delete) — fine.
            }

            if (!response.ok) {
                throw new Error(data.error || 'Something went wrong.');
            }
            return data;
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str == null ? '' : String(str);
            return div.innerHTML;
        }

        function todayLabel() {
            const months = ['', 'January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
            const now = new Date();
            return months[now.getMonth() + 1] + ' ' + now.getDate() + ', ' + now.getFullYear();
        }

        // ── Auth ─────────────────────────────────────────────────────────

        function showDashboard(session) {
            authScreen.classList.add('ap-hidden');
            dashboard.classList.remove('ap-hidden');
            userLabel.textContent = session.user.fullName + ' · ' + session.user.role;
            renderNav(session.user.role);
            showSection(activeSection);
        }

        function showAuth() {
            dashboard.classList.add('ap-hidden');
            authScreen.classList.remove('ap-hidden');
        }

        loginForm.addEventListener('submit', async function (e) {
            e.preventDefault();
            hideMsg(loginMsg);
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            loginBtn.disabled = true;
            loginBtn.textContent = 'Signing in…';
            try {
                const data = await apiFetch('/api/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({ email, password }),
                });
                if (data.user.role !== 'LEADER' && data.user.role !== 'ADMIN') {
                    throw new Error("This account can't publish content — sign in as a leader or administrator.");
                }
                setSession({ token: data.token, user: data.user });
                showDashboard({ token: data.token, user: data.user });
            } catch (err) {
                showMsg(loginMsg, err.message, 'err');
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign in';
            }
        });

        logoutBtn.addEventListener('click', function () {
            clearSession();
            showAuth();
        });

        // ── Nav ──────────────────────────────────────────────────────────

        function renderNav(role) {
            sectionNav.innerHTML = '';
            SECTIONS.filter((s) => s.roles.includes(role)).forEach((section) => {
                const btn = document.createElement('button');
                btn.className = 'ap-nav-btn' + (section.key === activeSection ? ' active' : '');
                btn.textContent = section.navLabel;
                btn.addEventListener('click', () => showSection(section.key));
                sectionNav.appendChild(btn);
            });
        }

        function sectionOf(key) {
            return SECTIONS.find((s) => s.key === key);
        }

        function showSection(key) {
            activeSection = key;
            editingItem = null;
            const session = getSession();
            renderNav(session.user.role);
            const section = sectionOf(key);
            topbarSection.textContent = section.title;
            renderSectionShell(section);
            loadList(section);
        }

        // ── Generic list + form engine ──────────────────────────────────

        function renderSectionShell(section) {
            sectionContent.innerHTML =
                '<div class="ap-card">' +
                '  <div class="ap-card-title">' + escapeHtml(section.addLabel) + '</div>' +
                (section.description ? '  <div class="ap-card-sub">' + escapeHtml(section.description) + '</div>' : '') +
                '  <div class="ap-msg" id="formMsg"></div>' +
                '  <form id="itemForm"></form>' +
                '</div>' +
                '<div class="ap-card">' +
                '  <div class="ap-card-title">' + escapeHtml(section.listLabel) + '</div>' +
                '  <div class="ap-card-sub">Tap an entry below to edit or remove it.</div>' +
                '  <div class="ap-msg" id="listMsg"></div>' +
                '  <div id="itemList" class="ap-list"></div>' +
                '</div>';
            buildForm(section, null);
        }

        function buildForm(section, item) {
            editingItem = item;
            const form = document.getElementById('itemForm');
            form.innerHTML = '';

            section.fields.forEach((field) => {
                const wrap = document.createElement('div');
                wrap.className = 'ap-field';
                const label = document.createElement('label');
                label.textContent = field.label;
                label.setAttribute('for', 'f_' + field.key);
                wrap.appendChild(label);

                let input;
                if (field.type === 'textarea') {
                    input = document.createElement('textarea');
                } else if (field.type === 'select') {
                    input = document.createElement('select');
                    field.options.forEach((opt) => {
                        const o = document.createElement('option');
                        o.value = opt;
                        o.textContent = opt;
                        input.appendChild(o);
                    });
                } else {
                    input = document.createElement('input');
                    input.type = 'text';
                }
                input.id = 'f_' + field.key;
                if (field.hint && input.tagName !== 'SELECT') input.placeholder = field.hint;
                if (item) input.value = item[field.key] || '';
                wrap.appendChild(input);

                if (field.hint && input.tagName === 'SELECT') {
                    // selects show hints via a small note instead of a placeholder
                }
                form.appendChild(wrap);
            });

            (section.boolFields || []).forEach((field) => {
                const row = document.createElement('div');
                row.className = 'ap-switch-row';
                const span = document.createElement('span');
                span.textContent = field.label;
                const input = document.createElement('input');
                input.type = 'checkbox';
                input.id = 'f_' + field.key;
                input.checked = item ? !!item[field.key] : false;
                row.appendChild(span);
                row.appendChild(input);
                form.appendChild(row);
            });

            const btnRow = document.createElement('div');
            btnRow.className = 'ap-btn-row';
            const submitBtn = document.createElement('button');
            submitBtn.type = 'submit';
            submitBtn.className = 'ap-btn full';
            submitBtn.id = 'formSubmitBtn';
            submitBtn.textContent = item ? 'Save changes' : 'Add';
            btnRow.appendChild(submitBtn);
            form.appendChild(btnRow);

            if (item) {
                const btnRow2 = document.createElement('div');
                btnRow2.className = 'ap-btn-row';
                const cancelBtn = document.createElement('button');
                cancelBtn.type = 'button';
                cancelBtn.className = 'ap-btn ghost full';
                cancelBtn.textContent = 'Cancel edit';
                cancelBtn.addEventListener('click', () => buildForm(section, null));
                const deleteBtn = document.createElement('button');
                deleteBtn.type = 'button';
                deleteBtn.className = 'ap-btn danger full';
                deleteBtn.textContent = 'Remove';
                deleteBtn.addEventListener('click', () => deleteItem(section, item));
                btnRow2.appendChild(cancelBtn);
                btnRow2.appendChild(deleteBtn);
                form.appendChild(btnRow2);
            }

            form.onsubmit = (e) => submitForm(e, section);
        }

        async function submitForm(e, section) {
            e.preventDefault();
            const formMsg = document.getElementById('formMsg');
            hideMsg(formMsg);

            const values = {};
            section.fields.forEach((field) => {
                values[field.key] = document.getElementById('f_' + field.key).value.trim();
            });
            (section.boolFields || []).forEach((field) => {
                values[field.key] = document.getElementById('f_' + field.key).checked;
            });

            for (const field of section.fields) {
                if (field.required && !values[field.key]) {
                    showMsg(formMsg, 'Fill in ' + field.label.toLowerCase() + '.', 'err');
                    return;
                }
            }

            if (section.extraPayload) Object.assign(values, section.extraPayload());

            const btn = document.getElementById('formSubmitBtn');
            const editing = !!editingItem;
            btn.disabled = true;
            btn.textContent = editing ? 'Saving…' : 'Adding…';
            try {
                if (editing) {
                    await apiFetch(section.apiPath + '/' + editingItem.id, {
                        method: 'PATCH',
                        body: JSON.stringify(values),
                    });
                } else {
                    await apiFetch(section.apiPath, {
                        method: 'POST',
                        body: JSON.stringify(values),
                    });
                }
                showMsg(formMsg, editing ? 'Saved.' : 'Added.', 'ok');
                buildForm(section, null);
                loadList(section);
            } catch (err) {
                showMsg(formMsg, err.message, 'err');
            } finally {
                btn.disabled = false;
                btn.textContent = editing ? 'Save changes' : 'Add';
            }
        }

        async function loadList(section) {
            const listMsg = document.getElementById('listMsg');
            const itemList = document.getElementById('itemList');
            hideMsg(listMsg);
            itemList.innerHTML = '';
            try {
                const data = await apiFetch(section.apiPath);
                const items = data[section.dataKey] || [];
                if (items.length === 0) {
                    itemList.innerHTML = '<div class="ap-empty">Nothing added yet.</div>';
                    return;
                }
                items.forEach((item) => itemList.appendChild(renderRow(section, item)));
            } catch (err) {
                showMsg(listMsg, err.message, 'err');
            }
        }

        function renderRow(section, item) {
            const row = document.createElement('div');
            row.className = 'ap-row';
            row.addEventListener('click', () => {
                buildForm(section, item);
                document.getElementById('itemForm').scrollIntoView({ behavior: 'smooth', block: 'start' });
            });

            const thumbUrl = section.thumbField ? item[section.thumbField] : null;
            const thumb = document.createElement(thumbUrl ? 'img' : 'div');
            if (thumbUrl) {
                thumb.className = 'ap-row-thumb';
                thumb.src = thumbUrl;
                thumb.alt = section.titleOf(item);
            } else {
                thumb.className = 'ap-row-thumb-empty';
                thumb.textContent = section.key === 'announcements' ? 'TEXT' : '—';
            }
            row.appendChild(thumb);

            const main = document.createElement('div');
            main.className = 'ap-row-main';
            main.innerHTML =
                '<div class="ap-row-title">' + escapeHtml(section.titleOf(item)) + '</div>' +
                '<div class="ap-row-meta">' + escapeHtml(section.subtitleOf(item)) + '</div>';
            row.appendChild(main);

            const chevron = document.createElement('span');
            chevron.className = 'ap-row-chevron';
            chevron.textContent = '›';
            row.appendChild(chevron);

            return row;
        }

        async function deleteItem(section, item) {
            if (!confirm("Remove this entry? This can't be undone.")) return;
            const formMsg = document.getElementById('formMsg');
            hideMsg(formMsg);
            try {
                await apiFetch(section.apiPath + '/' + item.id, { method: 'DELETE' });
                buildForm(section, null);
                loadList(section);
            } catch (err) {
                showMsg(formMsg, err.message, 'err');
            }
        }

        // Restore a session from a previous visit, if there is one.
        (function init() {
            const session = getSession();
            if (session && session.token) {
                showDashboard(session);
            } else {
                showAuth();
            }
        })();
    </script>
</body>
</html>
