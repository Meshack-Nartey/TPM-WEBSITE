# Monorepo: the website lives in frontend/. Publishing that folder here means
# Netlify needs no dashboard "base directory" change — this file overrides it.
[build]
  publish = "frontend"

# Security headers for all pages.
# Also revalidate every request by default so clean URLs (the site root "/" and
# extensionless pretty URLs like "/about") always fetch the latest HTML. The
# "/*.html" rule below never matches those paths, so without this the CDN/browser
# could keep serving a stale page after a deploy. More specific rules for images
# and videos override this to keep their long-term caching.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=0, must-revalidate"

# CSS and JS are referenced by fixed, un-fingerprinted filenames (e.g. styles.css,
# script.js), so they must be revalidated on every request. Otherwise browsers keep
# serving stale copies after a deploy. Netlify serves ETags, so revalidation returns
# a cheap 304 when the file is unchanged.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Long-term cache for images
[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Long-term cache for videos
[[headers]]
  for = "/assets/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# HTML must always be revalidated so page changes appear immediately after a deploy.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/home"
  to = "/"
  status = 301
